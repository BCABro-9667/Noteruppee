<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle accent circle -->
  <circle cx="380" cy="130" r="70" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="120" cy="400" r="90" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Centered Rupee Symbol Symbolizing Wealth & Tracking -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Top Horizontal Bar -->
    <rect x="156" y="140" width="200" height="34" rx="17" />
    <!-- Second Horizontal Bar -->
    <rect x="156" y="200" width="160" height="34" rx="17" />
    <!-- Vertical and Curve -->
    <path d="M 220 140 L 220 280 C 270 280, 310 240, 310 200 C 310 160, 270 140, 220 140 Z" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Diagonal Slanted Leg -->
    <path d="M 210 270 L 325 385" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>
